<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가벼운 타이머 - 캘린더</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="clock-box">
      <p class="clock-time">HH:MM:SS</p>
      <p class="clock-date">20nn.MM.DD</p>
    </div>
    <a href="main.html" class="mini-timer-link" title="메인 타이머로 돌아가기">
      <span class="mini-timer-value">30:00</span>
      <span class="mini-timer-label">타이머 · 메인으로 복귀</span>
    </a>
  </header>

  <main>
    <nav>
      <ul>
        <li><a href="calendar.html" class="nav-circle active">캘린더</a></li>
        <li><a href="memo.html" class="nav-circle">메모장</a></li>
      </ul>
    </nav>

    <section>
      <!-- 다른 HTML이랑 연동해서 날짜 불러오는것도 JS 써야할듯 -->
      <div class="content-card">
        <h2>날짜별 집중 기록</h2>
        <p>2026년 11월</p>
        <table>
          <!-- 뭐야 나 AI한테 안시켰는데 지 혼자 캘린더 하드코딩 했네 -->
          <caption>2026년 11월 일정표</caption>
          <thead>
            <tr>
              <th>일</th>
              <th>월</th>
              <th>화</th>
              <th>수</th>
              <th>목</th>
              <th>금</th>
              <th>토</th>
            </tr>
          </thead>
          <tbody>
            <!-- 달력 날짜 및 기록 연동은 추후 JS로 개발할 예정 -->
            <tr>
              <td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td>
            </tr>
            <tr>
              <td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td><td>14</td>
            </tr>
            <tr>
              <td>15</td><td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td>21</td>
            </tr>
            <tr>
              <td>22</td><td>23</td><td>24</td><td>25</td><td>26</td><td>27</td><td>28</td>
            </tr>
            <tr>
              <td>29</td><td>30</td><td></td><td></td><td></td><td></td><td></td>
            </tr>
          </tbody>
        </table>
        <h3>선택한 날짜</h3>
        <p>집중 시간과 일정이 여기에 표시됩니다.</p>
        <h3>개인 일정 추가</h3>
        <form>
          <p><label for="event-title">일정 이름</label></p>
          <input type="text" id="event-title" name="event-title">
          <p><label for="event-date">날짜</label></p>
          <input type="date" id="event-date" name="event-date">
        </form>
      </div>
    </section>

    <aside>
      <ul>
        <li><a href="todo.html" class="nav-circle">ToDo</a></li>
        <li><a href="aboutme.html" class="nav-circle">About<br>Me</a></li>
      </ul>
    </aside>
  </main>

  <footer>
    <p>가벼운 타이머 · Pomodoro Focus Workspace</p>
  </footer>
</body>
</html>
