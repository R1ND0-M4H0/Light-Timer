<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가벼운 타이머 - 메모장</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="clock-box">
      <p class="clock-time">HH:MM:SS</p>
      <p class="clock-date">20nn.MM.DD</p>
    </div>
    <a href="main.html" class="mini-timer-link" title="메인 타이머로 돌아가기">
      <span class="mini-timer-value">30:00</span>
      <span class="mini-timer-label">타이머 · 메인으로 복귀</span>
    </a>
  </header>

  <main>
    <nav>
      <ul>
        <li><a href="calendar.html" class="nav-circle">캘린더</a></li>
        <li><a href="memo.html" class="nav-circle active">메모장</a></li>
      </ul>
    </nav>

    <section>
      <!-- 적은 내용을 스티커메모 처럼 할까 아니면 걍 기존 방식 유지할까 -->
       <!-- 적은 내용 저장하는건 JS 써야하나 -->
      <div class="content-card">
        <h2>메모장</h2>
        <p>공부한 내용이나 작업 중 떠오른 생각을 기록합니다.</p>
        <form>
          <p><label for="memo-title">메모 제목</label></p>
          <input type="text" id="memo-title" name="memo-title">
          <p><label for="memo-content">메모 내용</label></p>
          <textarea id="memo-content" name="memo-content" rows="6" cols="40"></textarea>
        </form>
        <h3>내 메모</h3>
        <p>작성한 메모가 여기에 표시됩니다.</p>
      </div>
    </section>

    <aside>
      <ul>
        <li><a href="todo.html" class="nav-circle">ToDo</a></li>
        <li><a href="aboutme.html" class="nav-circle">About<br>Me</a></li>
      </ul>
    </aside>
  </main>

  <footer>
    <p>가벼운 타이머 · Pomodoro Focus Workspace</p>
  </footer>
</body>
</html>
