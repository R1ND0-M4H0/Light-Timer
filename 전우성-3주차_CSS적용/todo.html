<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가벼운 타이머 - ToDo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="clock-box">
      <p class="clock-time">HH:MM:SS</p>
      <p class="clock-date">20nn.MM.DD</p>
    </div>
    <a href="main.html" class="mini-timer-link" title="메인 타이머로 돌아가기">
      <span class="mini-timer-value">30:00</span>
      <span class="mini-timer-label">타이머 · 메인으로 복귀</span>
    </a>
  </header>

  <main>
    <nav>
      <ul>
        <li><a href="calendar.html" class="nav-circle">캘린더</a></li>
        <li><a href="memo.html" class="nav-circle">메모장</a></li>
      </ul>
    </nav>

    <section>
      <!-- 왜이리 JS써야하는게 많어 나 JS못다뤄서 AI한테 짬처리 시켜야한다고 AI비중 컷 안걸리려나 -->
      <div class="content-card">
        <h2>ToDo</h2>
        <p>해야 할 일과 마감일을 정리합니다.</p>
        <form>
          <p><label for="todo-title">할 일</label></p>
          <input type="text" id="todo-title" name="todo-title">
          <p><label for="todo-due">마감일</label></p>
          <input type="date" id="todo-due" name="todo-due">
        </form>
        <h3>미완료 작업</h3>
        <ul><li>추가한 미완료 작업이 여기에 표시됩니다.</li></ul>
        <h3>완료한 작업</h3>
        <ul><li>완료한 작업이 여기에 표시됩니다.</li></ul>
      </div>
    </section>

    <aside>
      <ul>
        <li><a href="todo.html" class="nav-circle active">ToDo</a></li>
        <li><a href="aboutme.html" class="nav-circle">About<br>Me</a></li>
      </ul>
    </aside>
  </main>

  <footer>
    <p>가벼운 타이머 · Pomodoro Focus Workspace</p>
  </footer>
</body>
</html>
